name: Web app (iPhone)

on:
  push:
    branches: [main, master, ios-pwa]
    paths: ['web/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/web.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, unit tests, WebKit iPhone E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Install Playwright WebKit
        run: npx playwright install --with-deps webkit
      - name: E2E on WebKit with iPhone 15 emulation
        run: npx playwright test --project=webkit-iphone

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-results
          path: web/test-results/
          if-no-files-found: ignore
          retention-days: 7
